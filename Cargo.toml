[package]
name = "discourse-tui"
version = "20260125.0.0"
edition = "2021"
authors = ["Jake Goldsborough"]
description = "Terminal UI for browsing Discourse forums"
license = "MIT"
repository = "https://github.com/ducks/discourse-tui"
keywords = ["discourse", "tui", "terminal", "forum"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
discourse-api-rs = "20260125.0.0"
tokio = { version = "1.0", features = ["rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
regex = "1.0"
