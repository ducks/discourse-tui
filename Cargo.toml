[package]
name = "discourse-tui"
version = "20251117.0.0"
edition = "2021"
authors = ["Jake Goldsborough"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
discourse-api-rs = { git = "https://github.com/ducks/discourse-api-rs" }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
regex = "1.0"
